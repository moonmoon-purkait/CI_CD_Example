name: Python application

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Check out code
        uses: actions/checkout@v3  # Using the latest v3 of actions/checkout

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v3  # Updated to v3 for latest features
        with:
          python-version: '3.8'
          

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # Step 4: Run the tests
      - name: Run tests
        run: |
          pytest
